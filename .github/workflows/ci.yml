name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npm run lint
      - name: Validate question data
        run: npm run validate:data
      - name: Run core tests
        run: npm test
      - name: Build production bundle
        run: npm run build
